<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141c3a">
  <title>MyDay · sem conexão</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f5ef; --ink:#141c3a; --muted:#5d6484; --accent:#f0a020; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1226; --ink:#eef0fb; --muted:#9aa3c7; --accent:#f0b84a; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; text-align:center;
      background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    img { width:112px; height:112px; border-radius:28px; box-shadow:0 10px 30px rgba(20,28,58,.25); }
    h1 { font-size:1.5rem; margin:20px 0 6px; }
    p { margin:0 auto 24px; max-width:28ch; color:var(--muted); line-height:1.5; }
    button { font:inherit; font-weight:700; border:0; border-radius:14px; padding:14px 28px; background:var(--accent); color:#141c3a; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/logo.svg" alt="">
    <h1>Sem conexão</h1>
    <p>Suas tarefas ficam guardadas com segurança no servidor. Volte a ficar online para vê-las.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
