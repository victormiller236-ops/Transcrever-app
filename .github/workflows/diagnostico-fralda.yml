name: Diagnóstico das farmácias (fralda)

on:
  workflow_dispatch:
  push: # temporário: roda ao enviar a branch de trabalho; remover antes do merge
    branches: [claude/diaper-price-agent-7cqfh0]
    paths: [".github/workflows/diagnostico-fralda.yml", "precos-fralda/diagnostico.py"]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python precos-fralda/diagnostico.py
